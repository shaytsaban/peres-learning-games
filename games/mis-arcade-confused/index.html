<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ארקייד המבולבלים: קרב המערכות</title>
<style>
:root{
  --tps:#22d3a8; --tps-d:#0f9e7c;
  --mis:#38bdf8; --mis-d:#1d7fb8;
  --ess:#a78bfa; --ess-gold:#fbbf24; --ess-d:#6d4fd1;
  --trash:#94a3b8; --trash-d:#475569;
  --bg0:#070a16; --bg1:#0e1530; --panel:rgba(13,18,42,.92);
  --ink:#eef2ff; --ink-dim:#9aa4c7;
  --danger:#f87171; --good:#4ade80; --warn:#facc15; --pink:#f472b6;
  --radius:16px;
  font-size:16px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; min-height:100vh; background:radial-gradient(1200px 800px at 50% -10%, #1c2450 0%, var(--bg0) 55%), var(--bg0);
  color:var(--ink); font-family:"Segoe UI","Arial Hebrew","Noto Sans Hebrew",Arial,sans-serif;
  font-weight:700; overflow-x:hidden;
  display:flex; align-items:center; justify-content:center; padding:14px;
}
button{font-family:inherit; font-weight:800; cursor:pointer;}
h1,h2,h3,p{margin:0;}
.hidden{display:none !important;}
.pixel{font-family:"Courier New",monospace; letter-spacing:1px;}

/* ===== ARCADE CABINET FRAME ===== */
#cabinet{
  position:relative; width:min(96vw,900px); height:min(94vh,900px);
  background:linear-gradient(160deg,#2a1e55,#150f2e 60%);
  border-radius:26px; padding:16px;
  box-shadow:0 0 0 3px #3a2b74, 0 0 40px rgba(140,100,255,.35), inset 0 0 60px rgba(0,0,0,.5);
  display:flex; flex-direction:column;
}
#marquee{
  height:26px; border-radius:10px; margin-bottom:10px;
  background:repeating-linear-gradient(90deg, var(--pink) 0 14px, var(--ess-gold) 14px 28px, var(--mis) 28px 42px, var(--tps) 42px 56px);
  background-size:200% 100%;
  animation:marquee-move 3s linear infinite;
  box-shadow:0 0 18px rgba(244,114,182,.6);
  opacity:.9;
}
@keyframes marquee-move{ to{ background-position:-56px 0; } }
#screen-wrap{
  position:relative; flex:1; min-height:0; border-radius:14px; overflow:hidden;
  background:linear-gradient(180deg,#0a0f24,#050813);
  box-shadow:inset 0 0 0 4px #000, inset 0 0 40px rgba(0,0,0,.7);
}
#crt{
  position:absolute; inset:0; pointer-events:none; z-index:50; mix-blend-mode:overlay;
  background:repeating-linear-gradient(180deg, rgba(255,255,255,.05) 0px, rgba(255,255,255,.05) 1px, transparent 2px, transparent 3px);
}
#vignette{
  position:absolute; inset:0; pointer-events:none; z-index:49;
  box-shadow:inset 0 0 120px rgba(0,0,0,.65);
}
#screen{
  position:absolute; inset:0; overflow:hidden;
}

/* ===== HUD ===== */
#hud{
  position:absolute; top:0; right:0; left:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 12px; font-size:.85rem;
  background:linear-gradient(180deg, rgba(5,8,20,.85), transparent);
  pointer-events:none;
}
#hud > div{display:flex; align-items:center; gap:8px;}
.hud-chip{
  background:rgba(15,20,45,.75); border:1px solid rgba(255,255,255,.12);
  border-radius:999px; padding:4px 10px; display:flex; align-items:center; gap:6px;
  pointer-events:auto;
}
#lives-chip span.heart{filter:drop-shadow(0 0 4px rgba(248,113,113,.8));}
#hud #combo-chip{color:var(--warn); display:none;}
#hud #combo-chip.show{display:flex;}
#pause-btn,#music-btn{background:rgba(15,20,45,.75); border:1px solid rgba(255,255,255,.2); color:var(--ink); border-radius:999px; padding:5px 10px; pointer-events:auto;}

/* ===== GENERIC PANELS ===== */
.panel{
  background:var(--panel); border:1px solid rgba(255,255,255,.12);
  border-radius:var(--radius); box-shadow:0 10px 30px rgba(0,0,0,.45);
  backdrop-filter:blur(6px);
}
.stage-view{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:54px 16px 16px; gap:12px; text-align:center;}
.stage-title{font-size:1.15rem; color:var(--ink);}
.stage-sub{font-size:.8rem; color:var(--ink-dim);}

.btn{
  border:none; border-radius:12px; padding:10px 18px; font-size:.95rem; color:#0a0f1f;
  background:linear-gradient(180deg,#fff,#dfe6ff); box-shadow:0 4px 0 #9aa4c7, 0 8px 16px rgba(0,0,0,.35);
  transition:transform .08s;
}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 #9aa4c7;}
.btn-primary{background:linear-gradient(180deg,var(--mis),var(--mis-d)); color:#fff; box-shadow:0 4px 0 #0c4f75, 0 8px 16px rgba(0,0,0,.35);}
.btn-good{background:linear-gradient(180deg,var(--good),#16a34a); color:#04210f; box-shadow:0 4px 0 #0e5c28,0 8px 16px rgba(0,0,0,.35);}
.btn-warn{background:linear-gradient(180deg,var(--warn),#d97706); color:#2a1500; box-shadow:0 4px 0 #7c3e05,0 8px 16px rgba(0,0,0,.35);}
.btn-danger{background:linear-gradient(180deg,var(--danger),#b91c1c); color:#fff; box-shadow:0 4px 0 #6b0f0f,0 8px 16px rgba(0,0,0,.35);}
.btn-ghost{background:transparent; border:1px solid rgba(255,255,255,.3); color:var(--ink); box-shadow:none;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}

/* ===== MASCOT ===== */
.mascot{position:relative; width:64px; height:88px; margin:0 auto; transform:scale(1.3); transform-origin:center bottom;}
.mascot.hero{
  position:absolute; right:50%; top:8px; transform:translateX(50%) scale(2); transform-origin:center top;
  z-index:75; animation:hero-bob 2.6s ease-in-out infinite; filter:drop-shadow(0 14px 18px rgba(0,0,0,.55));
  pointer-events:none;
}
@keyframes hero-bob{0%,100%{transform:translateX(50%) scale(2) rotate(-2deg) translateY(0);} 50%{transform:translateX(50%) scale(2) rotate(2deg) translateY(8px);}}
.mascot .body{
  position:absolute; inset:0; border-radius:50% 50% 46% 46% / 60% 60% 40% 40%;
  background:linear-gradient(160deg,#ffb199,#e8664a 70%);
  box-shadow:inset -6px -8px 14px rgba(0,0,0,.25), inset 6px 6px 10px rgba(255,255,255,.25);
}
.mascot .eye{position:absolute; top:26px; width:16px; height:16px; background:#fff; border-radius:50%; box-shadow:0 0 0 2px #1a1030;}
.mascot .eye::after{content:'';position:absolute; inset:4px; background:#1a1030; border-radius:50%;}
.mascot .eye.l{right:14px;} .mascot .eye.r{right:34px;}
.mascot .antenna{position:absolute; top:-14px; right:26px; width:6px; height:16px; background:#7c8; border-radius:3px;}
.mascot .antenna::after{content:'';position:absolute; top:-9px; right:-3px; width:12px; height:12px; border-radius:50%; background:var(--pink); box-shadow:0 0 10px var(--pink); animation:blink 1.1s infinite;}
@keyframes blink{50%{opacity:.3;}}
.mascot .accessory{position:absolute; top:6px; right:4px; font-size:20px;}
.mascot.wobble{animation:wobble .5s ease;}
@keyframes wobble{0%,100%{transform:rotate(0);}25%{transform:rotate(-8deg);}75%{transform:rotate(8deg);}}
.mascot.dizzy .eye::after{animation:spin 0.6s linear infinite;}

/* ===== TOAST / SPEECH BUBBLE ===== */
#toast-layer{position:absolute; inset:0; z-index:60; pointer-events:none;}
.toast{
  position:absolute; max-width:78%; padding:10px 14px; border-radius:14px; font-size:.85rem;
  background:#fff; color:#1a1030; box-shadow:0 8px 20px rgba(0,0,0,.4);
  animation:toast-in .25s ease, toast-out .3s ease 2.4s forwards;
}
.toast.bad{background:#fff1f1; border:2px solid var(--danger);}
.toast.good{background:#f0fff4; border:2px solid var(--good);}
@keyframes toast-in{from{transform:scale(.6) translateY(10px); opacity:0;} to{transform:scale(1) translateY(0); opacity:1;}}
@keyframes toast-out{to{opacity:0; transform:translateY(-8px);}}

/* ===== CONFETTI ===== */
.confetti{position:absolute; width:8px; height:8px; border-radius:2px; z-index:65; pointer-events:none; animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(120px) rotate(320deg); opacity:0;}}

/* ===== MENU ===== */
#menu-view{gap:18px;}
#menu-title{font-size:1.5rem; line-height:1.3; background:linear-gradient(90deg,var(--tps),var(--mis),var(--ess-gold)); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 12px rgba(150,120,255,.4));}
#menu-tagline{color:var(--ink-dim); font-size:.82rem; max-width:320px;}
#menu-credit{color:var(--ink-dim); font-size:.68rem; opacity:.7; max-width:300px;}
#hero-mascot-slot{position:relative; height:0;}

/* ===== MAP ===== */
#map-view{justify-content:flex-start; padding-top:56px; overflow-y:auto; gap:14px;}
.map-track{display:flex; flex-direction:column; gap:16px; width:100%; max-width:420px; padding-bottom:20px;}
.node-btn{
  display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:16px; text-align:right;
  border:2px solid rgba(255,255,255,.15); background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
  color:var(--ink); position:relative;
}
.node-btn:nth-child(even){align-self:flex-end;}
.node-btn:nth-child(odd){align-self:flex-start;}
.node-btn .icon{font-size:1.8rem; width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.3); flex:none;}
.node-btn .txt{display:flex; flex-direction:column; gap:2px; text-align:right;}
.node-btn .txt b{font-size:.92rem;}
.node-btn .txt small{color:var(--ink-dim); font-size:.72rem;}
.node-btn .stars{font-size:.75rem; color:var(--warn); letter-spacing:2px;}
.node-btn.locked{opacity:.4; filter:grayscale(1);}
.node-btn.boss{border-color:var(--ess-gold);}

/* ===== DEFINITION CARD MODAL ===== */
#modal-root{position:absolute; inset:0; z-index:80; display:flex; align-items:center; justify-content:center; background:rgba(3,5,14,.72); backdrop-filter:blur(2px);}
.def-card{width:min(88%,380px); padding:20px; display:flex; flex-direction:column; gap:10px; text-align:right;}
.def-head{display:flex; align-items:center; gap:10px; border-bottom:2px solid rgba(255,255,255,.15); padding-bottom:10px;}
.def-head .badge{font-size:1.6rem; width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center;}
.def-head b{font-size:1.05rem;}
.def-head small{color:var(--ink-dim); font-size:.72rem;}
.def-body{font-size:.86rem; line-height:1.55; color:var(--ink);}
.def-ex{font-size:.78rem; color:var(--ink-dim); background:rgba(255,255,255,.05); border-radius:10px; padding:8px 10px;}
.def-slang{display:none; font-size:.78rem; color:var(--pink); background:rgba(244,114,182,.08); border-radius:10px; padding:8px 10px;}
.def-slang.show{display:block;}
.tag-not-exam{align-self:flex-start; font-size:.7rem; padding:3px 8px; border-radius:6px; background:repeating-linear-gradient(45deg,#facc15,#facc15 6px,#111 6px,#111 12px); color:#111;}

/* ===== TWO-DOORS / RECIPE / LEVER shared elements ===== */
.scenario-box{width:min(90%,380px); padding:16px; font-size:.86rem; line-height:1.5;}
.door-row{display:flex; gap:14px;}
.door{flex:1; padding:16px 10px; border-radius:14px; font-size:.95rem; border:2px solid rgba(255,255,255,.15);}
.door.mis{background:linear-gradient(180deg, rgba(56,189,248,.18), rgba(56,189,248,.04)); border-color:var(--mis);}
.door.ess{background:linear-gradient(180deg, rgba(167,139,250,.2), rgba(167,139,250,.05)); border-color:var(--ess);}

/* ===== ITEM CARD (recipes / bonus / doors reasons) ===== */
.opt-card{width:100%; max-width:340px; padding:12px 14px; border-radius:12px; font-size:.82rem; text-align:right; border:2px solid rgba(255,255,255,.15); background:rgba(255,255,255,.05); color:var(--ink);}
.opt-card.correct{border-color:var(--good); background:rgba(74,222,128,.15);}
.opt-card.wrong{border-color:var(--danger); background:rgba(248,113,113,.15);}

/* ===== LEVERS ===== */
.lever-row{display:flex; gap:26px; align-items:flex-end; height:220px;}
.lever-col{display:flex; flex-direction:column; align-items:center; gap:8px;}
.lever-track{position:relative; width:44px; height:180px; border-radius:22px; background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.2); touch-action:none;}
.lever-handle{position:absolute; right:2px; left:2px; height:34px; border-radius:16px; background:linear-gradient(180deg,#fff,#c9d2f5); bottom:2px; box-shadow:0 3px 10px rgba(0,0,0,.4); cursor:grab;}
.lever-fill{position:absolute; right:0; left:0; bottom:0; border-radius:0 0 20px 20px; opacity:.5;}

/* ===== MIS CRAFT ===== */
.pot{width:120px; height:100px; border-radius:16px 16px 40px 40px; background:radial-gradient(ellipse at top, #2b3560, #131a34); border:3px solid rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-size:2rem; margin:6px auto;}
.pot.hot{box-shadow:0 0 30px var(--mis);}
.craft-cards{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
.craft-card{padding:10px 12px; border-radius:12px; background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.2); font-size:.8rem; touch-action:none; user-select:none;}

/* ===== CANVAS STAGES ===== */
canvas#game-canvas{position:absolute; inset:0; width:100%; height:100%; touch-action:none;}
.rush-bins{position:absolute; bottom:10px; right:8px; left:8px; display:flex; gap:6px; z-index:20;}
.bin-btn{flex:1; padding:10px 4px; border-radius:12px; font-size:.72rem; border:2px solid rgba(255,255,255,.25); color:#04101f;}
.bin-tps{background:linear-gradient(180deg,var(--tps),var(--tps-d)); color:#022;}
.bin-mis{background:linear-gradient(180deg,var(--mis),var(--mis-d)); color:#012;}
.bin-ess{background:linear-gradient(180deg,var(--ess),var(--ess-d)); color:#fff;}
.bin-trash{background:linear-gradient(180deg,var(--trash),var(--trash-d)); color:#fff;}

/* ===== BOSS ===== */
.boss-wrap{width:100%; height:100%; display:flex; flex-direction:column; padding:52px 12px 12px; gap:10px;}
.boss-top{display:flex; flex-direction:column; align-items:center; gap:6px;}
.boss-avatar{font-size:2.6rem;}
.hpbar{width:min(90%,340px); height:14px; border-radius:8px; background:rgba(255,255,255,.15); overflow:hidden; border:1px solid rgba(255,255,255,.3);}
.hpbar > i{display:block; height:100%; background:linear-gradient(90deg,var(--danger),var(--warn)); transition:width .3s;}
.timerbar{width:100%; height:6px; border-radius:4px; background:rgba(255,255,255,.15); overflow:hidden;}
.timerbar > i{display:block; height:100%; background:var(--warn); transition:width linear;}
.q-panel{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:12px; font-size:.84rem; line-height:1.5;}
.q-stem{white-space:pre-line;}
.q-opt{width:100%; text-align:right; padding:10px 12px; border-radius:10px; font-size:.8rem; border:2px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); color:var(--ink);}
.q-opt.correct{border-color:var(--good); background:rgba(74,222,128,.2);}
.q-opt.wrong{border-color:var(--danger); background:rgba(248,113,113,.2);}
.explain-box{font-size:.78rem; background:rgba(255,255,255,.06); border-radius:10px; padding:10px; border-right:3px solid var(--ess-gold);}

/* ===== RESULTS ===== */
.stars-row{font-size:1.6rem; letter-spacing:6px; color:var(--warn);}
.confuse-row{display:flex; justify-content:space-between; font-size:.78rem; width:min(90%,320px); border-bottom:1px dashed rgba(255,255,255,.15); padding:4px 0;}

@media (max-width:420px){
  :root{font-size:15px;}
  .lever-row{gap:16px;}
}
</style>
</head>
<body>
<div id="cabinet">
  <div id="hero-mascot-slot"></div>
  <div id="marquee"></div>
  <div id="screen-wrap">
    <div id="screen">
      <div id="hud">
        <div class="hud-chip" id="lives-chip"></div>
        <div class="hud-chip pixel" id="score-chip">0</div>
        <div class="hud-chip pixel" id="combo-chip">🔥 ×1</div>
        <button id="music-btn">🔊</button>
        <button id="pause-btn">⏸</button>
      </div>
      <canvas id="game-canvas"></canvas>
      <div id="stage-root"></div>
      <div id="toast-layer"></div>
      <div id="modal-root" class="hidden"></div>
    </div>
    <div id="vignette"></div>
    <div id="crt"></div>
  </div>
</div>
<script>
'use strict';

/* ============================================================
   CONTENT DATA — verified against the course chapter (TPS/MIS/ESS)
   ============================================================ */
const DEFS = {
  tps:{ key:'tps', heName:'TPS — מערכת עיבוד תנועות', enName:'Transaction Processing System', color:'var(--tps)', icon:'🧾',
    def:`מערכת מידע שתפקידה לתעד (לרשום) עסקאות ואירועים באופן מלא, מדויק, מהיר ובזמן אמת. המערכת אוספת, שומרת ומאפשרת שליפה של נתוני עסקה ספציפית — אך אינה מפיקה דוחות או ניתוחים ניהוליים. משרתת בעיקר את הדרג התפעולי בארגון.`,
    example:`למשל: קופה רושמת בסופרמרקט, שעון נוכחות, מערכת זימון תורים, שערי כניסה ויציאה, מערכת עו״ש בבנק.`,
    slang:`יא חופר? TPS = הרובוט שרושם כל דבר שקורה, בלי לחשוב עליו יותר מדי.` },
  mis:{ key:'mis', heName:'MIS — מערכת לניהול ביניים', enName:'Management Information System', color:'var(--mis)', icon:'📊',
    def:`מערכת מידע שלוקחת את הנתונים המפורטים שנאספו במערכות TPS, מעבדת אותם (סיכומים, חתכים, ניתוחים בסיסיים) ומפיקה מהם דוחות ניהוליים המסייעים למנהלי ומנהלות ביניים לקבל החלטות שוטפות, לטווח קצר.`,
    example:`למשל: דוח מלאי, דוח תקני כוח אדם וחריגות שכר, דוח תקציבי, המלצות מותאמות אישית באפליקציית סטרימינג.`,
    slang:`יא חופר? MIS = הרובוט שלוקח את מה ש-TPS רשם, ומכין ממנו תמצית שמנהלים באמת יקראו.` },
  ess:{ key:'ess', heName:'ESS — מערכת לניהול בכיר/אסטרטגי', enName:'Executive Support System', color:'var(--ess-gold)', icon:'🔭',
    def:`מערכת מידע המיועדת להנהלה הבכירה, המשלבת מידע פנימי (מ-TPS ו-MIS) יחד עם מידע חיצוני (שוק, מתחרים, סביבה כלכלית) לתמיכה בהחלטות אסטרטגיות משמעותיות וארוכות טווח, המשפיעות על הארגון כולו. מציגה מידע בעיקר בכלים חזותיים (גרפים, דשבורדים), לאו דווקא בטבלאות מפורטות.`,
    example:`למשל: מעבר Apple ממעבדי Intel למעבדי M1 משלה, השקת קטגוריית מוצר חדשה, כניסה לשוק בינלאומי חדש.`,
    slang:`יא חופר? ESS = הרובוט שמסתכל גם פנימה וגם החוצה, ועוזר להנהלה להחליט לאן החברה הולכת בעוד חמש שנים.` },
};

const TPS_ITEMS = [
  {label:'קופה רושמת בסופרמרקט', icon:'🛒'}, {label:'מערכת זימון תורים', icon:'📅'},
  {label:'שעון נוכחות', icon:'⏱️'}, {label:'שער כניסה ויציאה', icon:'🚪'},
  {label:'מערכת עו״ש בבנק', icon:'🏦'}, {label:'הזמנת פיצה בוולט', icon:'🍕'},
  {label:'תשלום בביט', icon:'💸'}, {label:'אפליקציית Health בשעון חכם', icon:'⌚'},
  {label:'הורדת אפליקציה מה-App Store', icon:'📲'}, {label:'הזמנה מ-Shein', icon:'📦'},
];
const MIS_ITEMS = [

/* ============================================================
   AUDIO — Web Audio API oscillator beeps only, no external files
   ============================================================ */
let ACTX = null;
function ensureAudio(){ if(!ACTX){ try{ ACTX = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ACTX && ACTX.state==='suspended') ACTX.resume(); }
function beep(freq=440, dur=.12, type='square', gain=.06, delay=0){
  if(!ACTX) return;
  const t0 = ACTX.currentTime + delay;
  const osc = ACTX.createOscillator(); const g = ACTX.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0+.01);
  g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
  osc.connect(g); g.connect(ACTX.destination);
  osc.start(t0); osc.stop(t0+dur+.02);
}
const SFX = {
  correct(){ beep(660,.08,'square',.05); beep(880,.1,'square',.06,.07); },
  wrong(){ beep(180,.2,'sawtooth',.07); beep(120,.25,'sawtooth',.06,.08); },
  combo(){ beep(520,.06,'square',.05); beep(660,.06,'square',.05,.06); beep(880,.08,'square',.06,.12); },
  select(){ beep(400,.05,'triangle',.04); },
  cash(){ beep(1200,.04,'square',.04); beep(1600,.06,'square',.05,.04); },
  printer(){ beep(300,.03,'square',.03); beep(320,.03,'square',.03,.05); beep(300,.03,'square',.03,.1); },
  scope(){ beep(200,.2,'sine',.05); beep(400,.15,'sine',.05,.1); },
  victory(){ [523,659,784,1047].forEach((f,i)=>beep(f,.18,'square',.06,i*.14)); },
  boom(){ beep(90,.3,'sawtooth',.08); },
  jingle(){ [392,440,392,330,392,494,440].forEach((f,i)=>beep(f,.12,'triangle',.045,i*.11)); },
};

/* ============================================================
   BACKGROUND MUSIC — procedural, tempo rises with progress
   ============================================================ */
const MUSIC_BASSLINE = [110.00,130.81,164.81,146.83,110.00,98.00,164.81,146.83];
const MUSIC = { timer:null, step:0, intensity:0, enabled:!SAVE.musicMuted };
function musicTick(){
  if(!MUSIC.enabled || !ACTX){ MUSIC.timer = setTimeout(musicTick, 200); return; }
  const freq = MUSIC_BASSLINE[MUSIC.step % MUSIC_BASSLINE.length];
  beep(freq, 0.1, 'triangle', 0.028);
  if(MUSIC.step % 2===0) beep(freq*2, 0.05, 'square', 0.012, 0.02);
  if(MUSIC.step % 8===0) beep(55, 0.12, 'sine', 0.03);
  MUSIC.step++;
  const bpm = 108 + MUSIC.intensity*16;
  const stepMs = 60000/bpm/2;
  MUSIC.timer = setTimeout(musicTick, stepMs);
}
function startMusic(intensity){
  if(intensity!==undefined) MUSIC.intensity = intensity;
  if(MUSIC.timer) return;
  ensureAudio();
  MUSIC.step = 0;
  musicTick();
}
function stopMusic(){
  if(MUSIC.timer){ clearTimeout(MUSIC.timer); MUSIC.timer=null; }
}
function setMusicIntensity(level){ MUSIC.intensity = level; }
function toggleMusicMute(){
  MUSIC.enabled = !MUSIC.enabled;
  SAVE.musicMuted = !MUSIC.enabled;
  persist();
  renderMusicBtn();
}
function renderMusicBtn(){
  const b = $('#music-btn'); if(b) b.textContent = MUSIC.enabled? '🔊' : '🔇';
}

const HUD = { lives:3, maxLives:3, score:0, combo:0, comboMult:1 };
function hudReset(lives){
  HUD.lives = lives===undefined?3:lives; HUD.maxLives = HUD.lives; HUD.combo=0; HUD.comboMult=1;
  $('#hud').style.display='flex';
  renderHud();
}
function renderHud(){
  const hearts = '❤️'.repeat(Math.max(0,HUD.lives)) + '🖤'.repeat(Math.max(0,HUD.maxLives-HUD.lives));
  $('#lives-chip').innerHTML = `<span class="heart">${hearts}</span>`;
  $('#score-chip').textContent = '★ '+HUD.score;
  const comboChip = $('#combo-chip');
  if(HUD.comboMult>1){ comboChip.classList.add('show'); comboChip.textContent = '🔥 ×'+HUD.comboMult; }
  else comboChip.classList.remove('show');
}
function hudAddScore(pts){
  HUD.score += Math.round(pts*HUD.comboMult);
  SAVE.totalScore += Math.round(pts*HUD.comboMult);
  if(SAVE.totalScore > SAVE.highScore) SAVE.highScore = SAVE.totalScore;
  renderHud();
}
function hudCorrect(basePts){
  HUD.combo++; HUD.comboMult = HUD.combo>=15?5:HUD.combo>=10?4:HUD.combo>=6?3:HUD.combo>=3?2:1;
  hudAddScore(basePts);
  if(HUD.combo>0 && HUD.combo%8===0) confusedBurst();
  renderHud();
}
function hudWrong(loseLife){
  HUD.combo=0; HUD.comboMult=1;
  if(loseLife!==false){ HUD.lives = Math.max(0,HUD.lives-1); }
  renderHud();
  return HUD.lives<=0;
}
function hudHalfWrong(){
  HUD.combo=0; HUD.comboMult=1;
  HUD.lives = Math.max(0, HUD.lives - 0.5);
  renderHud();
  return HUD.lives<=0;
}

];
function nodeByKey(k){ return NODES.find(n=>n.key===k); }

function unlockAfter(key){
  const idx = NODE_ORDER.indexOf(key);
  if(idx>=0 && idx+1<NODE_ORDER.length) SAVE.nodeUnlocked[NODE_ORDER[idx+1]] = true;
  if(key==='rush') SAVE.nodeUnlocked.bonus = true;
  const allCore = NODE_ORDER.every(k=>(SAVE.nodeStars[k]||0)>0);
  if(allCore) SAVE.nodeUnlocked.boss = true;
}

const MUSIC_LEVELS = {tps:0, mis:1, ess:2, doors:2, rush:3, bonus:1};
function startNode(node){
  if(node.key==='boss' && !SAVE.nodeUnlocked.boss) return;
  if(!node.boss) hudReset(3);
  const launch = ()=>{
    if(!node.boss) startMusic(MUSIC_LEVELS[node.key] ?? 0);
    gotoScreen(root => node.run(root, result=>finishNode(node, result)));
  };
  if(node.defKeys && node.defKeys.length) showDefCard(node.defKeys, launch);
  else launch();
}

function finishNode(node, result){
  result = result || {};
  if(node.key==='bonus'){
    persist(); renderMap(); return;
  }
  if(!node.boss){
    SAVE.nodeStars[node.key] = Math.max(SAVE.nodeStars[node.key]||0, result.stars||0);
    unlockAfter(node.key);
    persist();
    showStageSummary(node, result);
  } else {
    SAVE.bossCleared = SAVE.bossCleared || !!result.won;
    SAVE.freePlayUnlocked = SAVE.freePlayUnlocked || !!result.won;
    persist();
    showBossResults(result);
  }
}

function starsHtml(n){
  n = Math.round(n||0);
  return '★★★'.slice(0,n) + '☆☆☆'.slice(0, 3-n);
}

function showStageSummary(node, result){
  gotoScreen(root=>{

    root.appendChild(el('div','stage-view', `

    $('#btn-again').addEventListener('click', ()=>startNode(node));
    $('#btn-map').addEventListener('click', renderMap);
  });
}

/* ============================================================
   STAGE 1 — TPS SLICE (Canvas, Fruit-Ninja style)
   ============================================================ */
function distToSegment(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1; const lenSq=dx*dx+dy*dy;
  let t = lenSq ? ((px-x1)*dx+(py-y1)*dy)/lenSq : 0;
  t = clamp(t,0,1);
  const cx=x1+t*dx, cy=y1+t*dy;
  return Math.hypot(px-cx, py-cy);
}
function runTpsSlice(root, onDone){
  const header = el('div','stage-view');
  header.style.pointerEvents='none'; header.style.justifyContent='flex-start'; header.style.paddingTop='46px';
  header.innerHTML = `<div class="panel" style="padding:6px 12px;font-size:.75rem;">✂️ חתכו רק פריטי <b style="color:var(--tps)">תיעוד (TPS)</b> • הימנעו מפצצות MIS/ESS</div>`;
  root.appendChild(header);

  const canvas = $('#game-canvas');
  canvas.style.display='block';
  const screenEl = $('#screen');
  function resize(){ canvas.width = screenEl.clientWidth; canvas.height = screenEl.clientHeight; }
  resize();
  const ctx = canvas.getContext('2d');

  const TOTAL = 20;
  const COMBINED_LABEL = 'מערכת נוכחות שגם מפיקה דוח כ״א (משולבת)';
  let spawned=0, correct=0, wrong=0, missed=0, ended=false;
  let items=[]; let trail=[]; let lastSpawn=0; let startTime=performance.now();

  function spawnItem(){
    spawned++;
    let kind, label, icon, combined=false;
    const roll = Math.random();
    if(spawned===7){ kind='tps'; label=COMBINED_LABEL; icon='🧾'; combined=true; }
    else if(roll<0.62){ kind='tps'; const it=pick(TPS_ITEMS); label=it.label; icon=it.icon; }
    else { kind='bomb'; const it = Math.random()<0.5?pick(MIS_ITEMS):pick(ESS_ITEMS); label=it.label; icon=it.icon; }
    const speed = rand(70,110) + Math.min(70, spawned*3);
    items.push({
      x:canvas.width+40, y:rand(80,canvas.height-120), vx:-speed, vy:rand(-14,14),
      r:34, label, icon, kind, combined, sliced:false, dead:false,
    });
  }

  function resolveHit(item, correctSlice){
    item.sliced=true;
    if(correctSlice){
      correct++;
      hudCorrect(item.combined?20:10);
      SFX.cash();
      burstConfetti(canvas.width-((canvas.width-item.x)||0), item.y, item.combined?26:12);
      if(item.combined) mascotHappy('מערכת משולבת: גם תיעוד (TPS) וגם דוח (MIS)! בונוס!');
    } else {
      wrong++;
      const isEnd = hudWrong(true);
      mascotConfused(`״${item.label}״ הוא/היא MIS/ESS — לא תיעוד עסקה בזמן אמת.`);
      if(isEnd) finish();
    }
  }

  function onPointerMove(e){
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX-rect.left), y=(e.clientY-rect.top);
    trail.push({x,y,t:performance.now()});
    if(trail.length>14) trail.shift();
    if(trail.length>=2 && e.buttons!==0 || (e.pointerType==='touch')){
      const p0=trail[trail.length-2], p1=trail[trail.length-1];
      if(p0){
        items.forEach(it=>{
          if(it.sliced||it.dead) return;
          const d = distToSegment(it.x,it.y,p0.x,p0.y,p1.x,p1.y);
          if(d < it.r){ resolveHit(it, it.kind==='tps'); }
        });
      }
    }
  }
  function onPointerDown(e){ ensureAudio(); trail=[{x:e.offsetX,y:e.offsetY,t:performance.now()}]; }
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);

  let raf=null; let lastFrameTime=null;
  function frame(now){
    if(ended) return;
    if(lastFrameTime===null) lastFrameTime = now;
    const dt = clamp(now-lastFrameTime, 0, 48);
    lastFrameTime = now;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // trail
    if(trail.length>1){
      ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=4; ctx.lineCap='round';
      ctx.beginPath();
      trail.forEach((p,i)=>{ if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
      ctx.stroke();
    }
    trail = trail.filter(p=>now-p.t<160);

    if(now-lastSpawn > Math.max(430, 950-spawned*22) && spawned<TOTAL){ spawnItem(); lastSpawn=now; }

    items.forEach(it=>{
      if(it.dead) return;
      if(!it.sliced){ it.x += it.vx*dt/1000; it.y += it.vy*dt/1000; }
      else { it.y += 3; it.x += it.vx*dt/1000*0.4; }
      // draw
      ctx.save();
      ctx.globalAlpha = it.sliced? 0.35:1;
      ctx.beginPath(); ctx.arc(it.x,it.y,it.r,0,Math.PI*2);
      ctx.fillStyle = it.sliced?'#333':(it.kind==='tps'?'rgba(34,211,168,.22)':'rgba(248,113,113,.22)');
      ctx.fill();
      ctx.lineWidth=3; ctx.strokeStyle = it.combined?'#fbbf24':(it.kind==='tps'?'#22d3a8':'#f87171');
      ctx.stroke();
      ctx.font='28px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='#fff'; ctx.fillText(it.icon, it.x, it.y-4);
      ctx.font='11px Arial'; ctx.fillStyle='#eef2ff';
      wrapLabel(ctx, it.label, it.x, it.y+it.r+4, 88);
      ctx.restore();
      if(it.x < -60){
        if(!it.sliced && it.kind==='tps'){ missed++; const isEnd=hudHalfWrong(); mascotConfused(`פספסתם ״${it.label}״ — זה היה תיעוד TPS אמיתי!`); if(isEnd) finish(); }
        it.dead=true;
      }
    });
    items = items.filter(it=>!it.dead);

    if(spawned>=TOTAL && items.length===0 && !ended) finish();
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);

  function wrapLabel(ctx,text,cx,cy,maxWidth){
    const words = text.split(' '); let line=''; let lines=[];
    words.forEach(w=>{
      const test = line? line+' '+w : w;
      if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line=w; } else line=test;
    });
    if(line) lines.push(line);
    lines = lines.slice(0,2);
    lines.forEach((l,i)=> ctx.fillText(l, cx, cy+i*12));
  }

  function finish(){
    if(ended) return; ended=true;
    cancelAnimationFrame(raf);
    canvas.removeEventListener('pointerdown', onPointerDown);
    canvas.removeEventListener('pointermove', onPointerMove);
    const attempts = correct+wrong+missed;
    const accuracy = attempts? correct/attempts : 1;
    const stars = accuracy>=.9?3:accuracy>=.7?2:attempts?1:0;
    onDone({accuracy, stars, tldr:`יא חופר? חתכתם ${correct} פריטי תיעוד נכונים. TPS = רק תיעוד, לא דוחות!`});
  }

  return function teardown(){
    ended=true;
    if(raf) cancelAnimationFrame(raf);
    canvas.removeEventListener('pointerdown', onPointerDown);
    canvas.removeEventListener('pointermove', onPointerMove);
    canvas.style.display='none';
  };
}

/* ============================================================
   STAGE 2 — MIS CRAFT (drag ingredients into the pot)
   ============================================================ */
function runMisCraft(root, onDone){
  const order = shuffle(MIS_RECIPES);
  let idx=0, correct=0, wrong=0, attemptsOnCurrent=0, ended=false;
  const listeners = [];

  const view = el('div','stage-view');
  root.appendChild(view);

  function renderRecipe(){
    if(idx>=order.length){ return finish(); }
    attemptsOnCurrent=0;
    const r = order[idx];
    const cards = shuffle([{t:r.correct,ok:true}, {t:r.wrong[0],ok:false}, {t:r.wrong[1],ok:false}]);
    view.innerHTML = `
      <div class="panel" style="padding:8px 14px;font-size:.78rem;max-width:340px;">🧩 המצרכים מ-TPS: <b style="color:var(--mis)">${escapeHtml(r.parts)}</b><br><span class="stage-sub">גררו את הדוח הנכון לקלחת</span></div>
      <div class="pot" id="pot">🍲</div>
      <div class="craft-cards" id="craft-cards">
        ${cards.map((c,i)=>`<div class="craft-card" data-ok="${c.ok}" id="card-${i}">${escapeHtml(c.t)}</div>`).join('')}
      </div>
      <div class="stage-sub">שלב ${idx+1} מתוך ${order.length}</div>
    `;
    const pot = view.querySelector('#pot');
    cards.forEach((c,i)=>{
      const cardEl = view.querySelector('#card-'+i);
      makeDraggable(cardEl, pot, (ok)=>onDrop(ok, cardEl, r));
    });
  }

  function makeDraggable(cardEl, pot, onDrop){
    let dragging=false, offX=0, offY=0, startRect=null;
    function down(e){
      ensureAudio();
      dragging=true; cardEl.setPointerCapture(e.pointerId);
      startRect = cardEl.getBoundingClientRect();
      offX = e.clientX - startRect.left; offY = e.clientY - startRect.top;
      cardEl.style.position='fixed'; cardEl.style.zIndex=200;
      cardEl.style.left = startRect.left+'px'; cardEl.style.top = startRect.top+'px';
      cardEl.style.width = startRect.width+'px';
      cardEl.__origin = {left:startRect.left, top:startRect.top};
    }
    function move(e){
      if(!dragging) return;
      cardEl.style.left = (e.clientX-offX)+'px';
      cardEl.style.top = (e.clientY-offY)+'px';
      const potRect = pot.getBoundingClientRect();
      const cx=e.clientX, cy=e.clientY;
      pot.classList.toggle('hot', cx>potRect.left&&cx<potRect.right&&cy>potRect.top&&cy<potRect.bottom);
    }
    function up(e){
      if(!dragging) return; dragging=false;
      const potRect = pot.getBoundingClientRect();
      const cx=e.clientX, cy=e.clientY;
      pot.classList.remove('hot');
      const hit = cx>potRect.left&&cx<potRect.right&&cy>potRect.top&&cy<potRect.bottom;
      if(hit){ onDrop(cardEl.dataset.ok==='true'); }
      else{
        cardEl.style.transition='left .25s,top .25s';
        cardEl.style.left = cardEl.__origin.left+'px'; cardEl.style.top = cardEl.__origin.top+'px';
        setTimeout(()=>{ cardEl.style.position=''; cardEl.style.transition=''; cardEl.style.left=''; cardEl.style.top=''; cardEl.style.width=''; },260);
      }
    }
    cardEl.addEventListener('pointerdown', down);
    cardEl.addEventListener('pointermove', move);
    cardEl.addEventListener('pointerup', up);
    listeners.push(()=>{ cardEl.removeEventListener('pointerdown',down); cardEl.removeEventListener('pointermove',move); cardEl.removeEventListener('pointerup',up); });
  }

  function onDrop(ok, cardEl, r){
    attemptsOnCurrent++;
    if(ok){
      correct++; hudCorrect(12); SFX.printer();
      const rect = view.querySelector('#pot').getBoundingClientRect();
      burstConfetti(rect.left+rect.width/2, rect.top+rect.height/2, 16);
      idx++; setTimeout(renderRecipe, 500);
    } else {
      const isEnd = hudHalfWrong();
      mascotConfused(`זה לא ${r.correct} — נסו שוב, מה באמת מסכם ${r.parts}?`);
      cardEl.style.position=''; cardEl.style.left=''; cardEl.style.top=''; cardEl.style.width='';
      if(attemptsOnCurrent>=3 || isEnd){ wrong++; idx++; setTimeout(renderRecipe, 400); }
      if(isEnd) finish();
    }
  }

  function finish(){
    if(ended) return; ended=true;
    const total = correct+wrong;
    const accuracy = total? correct/total : 1;
    const stars = accuracy>=.85?3:accuracy>=.6?2:total?1:0;
    onDone({accuracy, stars, tldr:'יא חופר? MIS לוקח מה ש-TPS אסף, ומבשל ממנו דוח שמנהלים יבינו בעשר שניות.'});
  }
  renderRecipe();
  return function teardown(){ ended=true; listeners.forEach(f=>f()); };
}

/* ============================================================
   STAGE 3 — ESS DUAL LEVERS
   ============================================================ */
function runEssLevers(root, onDone){
  const order = shuffle(ESS_SCENARIOS);
  let idx=0, correct=0, wrong=0, ended=false;
  const listeners=[];
  const view = el('div','stage-view'); root.appendChild(view);

  function renderScenario(){
    if(idx>=order.length) return finish();
    const s = order[idx];
    view.innerHTML = `
      <div class="panel scenario-box">${escapeHtml(s.text)}</div>
      <div class="lever-row">
        <div class="lever-col">
          <div class="lever-track" id="track-int"><div class="lever-fill" id="fill-int" style="background:var(--mis);height:0%"></div><div class="lever-handle" id="handle-int"></div></div>
          <small>מידע פנימי</small>
        </div>
        <div class="lever-col">
          <div class="lever-track" id="track-ext"><div class="lever-fill" id="fill-ext" style="background:var(--ess);height:0%"></div><div class="lever-handle" id="handle-ext"></div></div>
          <small>מידע חיצוני</small>
        </div>
      </div>
      <button class="btn btn-warn" id="btn-decide">קבל החלטה! ⚡</button>
      <div class="stage-sub">שלב ${idx+1} מתוך ${order.length}</div>
    `;
    let vInt=0, vExt=0;
    setupLever('track-int','handle-int','fill-int', v=>vInt=v);
    setupLever('track-ext','handle-ext','fill-ext', v=>vExt=v);
    const decideBtn = view.querySelector('#btn-decide');
    function onDecide(){
      ensureAudio();
      const ok = vInt>=0.7 && vExt>=0.7;
      if(ok){
        correct++; hudCorrect(15); SFX.scope();
        mascotHappy('שילוב מושלם של פנימי + חיצוני — החלטה אסטרטגית אמיתית!');
      } else {
        const isEnd = hudHalfWrong();
        mascotConfused('״זה קצת כמו הפלאשבק שלי מהוויכוחים עם האקסית...״ — צריך למשוך את שני המנופים יחד, גם פנימי וגם חיצוני.');
        wrong++;
        if(isEnd){ finish(); return; }
      }
      idx++; setTimeout(renderScenario, ok?650:900);
    }
    decideBtn.addEventListener('click', onDecide);
    listeners.push(()=>decideBtn.removeEventListener('click', onDecide));
  }

  function setupLever(trackId, handleId, fillId, onChange){
    const track = view.querySelector('#'+trackId);
    const handle = view.querySelector('#'+handleId);
    const fill = view.querySelector('#'+fillId);
    const H = 180, HANDLE_H = 34;
    handle.style.bottom = '2px';
    let dragging=false;
    function setFromClientY(clientY){
      const rect = track.getBoundingClientRect();
      let top = clientY - rect.top - HANDLE_H/2;
      top = clamp(top, 0, H-HANDLE_H);
      handle.style.bottom = (H-HANDLE_H-top)+'px';
      const v = 1 - top/(H-HANDLE_H);
      fill.style.height = Math.round(v*100)+'%';
      onChange(v);
    }
    function down(e){ ensureAudio(); dragging=true; handle.setPointerCapture(e.pointerId); setFromClientY(e.clientY); }
    function move(e){ if(dragging) setFromClientY(e.clientY); }
    function up(){ dragging=false; }
    handle.addEventListener('pointerdown', down);
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', up);
    track.addEventListener('pointerdown', e=>{ ensureAudio(); setFromClientY(e.clientY); });
    listeners.push(()=>{ handle.removeEventListener('pointerdown',down); handle.removeEventListener('pointermove',move); handle.removeEventListener('pointerup',up); });
  }

  function finish(){
    if(ended) return; ended=true;
    const total = correct+wrong;
    const accuracy = total? correct/total : 1;
    const stars = accuracy>=.85?3:accuracy>=.6?2:total?1:0;
    onDone({accuracy, stars, tldr:'יא חופר? ESS תמיד צריכה גם וגם: מידע פנימי + מידע חיצוני. חצי מידע = חצי החלטה.'});
  }
  renderScenario();
  return function teardown(){ ended=true; listeners.forEach(f=>f()); };
}

/* ============================================================
   STAGE 4 — TWO DOORS (MIS or ESS? the sharpest distinction)
   ============================================================ */
function runTwoDoors(root, onDone){
  const order = shuffle(DOOR_SCENARIOS);
  let idx=0, correct=0, wrong=0, ended=false;
  const listeners=[];
  const view = el('div','stage-view'); root.appendChild(view);

  function renderScenario(){
    if(idx>=order.length) return finish();
    const s = order[idx];
    view.innerHTML = `
      <div class="panel scenario-box">${escapeHtml(s.text)}</div>
      <div class="door-row" style="width:min(90%,340px)">
        <button class="door mis" id="door-mis">🚪 MIS</button>
        <button class="door ess" id="door-ess">🚪 ESS</button>
      </div>
      <div class="stage-sub">שלב ${idx+1} מתוך ${order.length}</div>
    `;
    function pickDoor(choice){
      ensureAudio();
      if(choice!==s.correct){
        const isEnd = hudHalfWrong(); wrong++;
        mascotConfused(`התשובה הנכונה היא ${s.correct}: ${s.reasonCorrect}`);
        if(isEnd){ finish(); return; }
        idx++; setTimeout(renderScenario, 1000);
        return;
      }
      askReason(s);
    }
    view.querySelector('#door-mis').addEventListener('click', ()=>pickDoor('MIS'));
    view.querySelector('#door-ess').addEventListener('click', ()=>pickDoor('ESS'));
  }

  function askReason(s){
    const reasons = shuffle([{t:s.reasonCorrect,ok:true},{t:s.reasonWrong,ok:false}]);
    view.innerHTML = `
      <div class="panel scenario-box">נכון! ${s.correct} 🎯<br><small class="stage-sub">עכשיו — למה?</small></div>
      <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;">
        ${reasons.map((r,i)=>`<button class="opt-card" id="reason-${i}">${escapeHtml(r.t)}</button>`).join('')}
      </div>
    `;
    reasons.forEach((r,i)=>{
      view.querySelector('#reason-'+i).addEventListener('click', (e)=>{
        ensureAudio();
        $$('#reason-0,#reason-1').forEach(()=>{});
        view.querySelectorAll('.opt-card').forEach((c,ci)=> c.classList.add(reasons[ci].ok?'correct':'wrong'));
        if(r.ok){ correct++; hudCorrect(14); SFX.scope(); mascotHappy('בדיוק! זו הסיבה האמיתית.'); }
        else { const isEnd=hudHalfWrong(); wrong++; mascotConfused('הנימוק הנכון: '+s.reasonCorrect); if(isEnd){ setTimeout(finish, 900); return; } }
        idx++; setTimeout(renderScenario, 1100);
      });
    });
  }

  function finish(){
    if(ended) return; ended=true;
    const total = correct+wrong;
    const accuracy = total? correct/total : 1;
    const stars = accuracy>=.8?3:accuracy>=.55?2:total?1:0;
    onDone({accuracy, stars, tldr:'יא חופר? MIS מול ESS זה לא כמות הפירוט — זה אופק ההחלטה: שוטף ומחלקתי מול אסטרטגי עם מידע חיצוני.'});
  }
  renderScenario();
  return function teardown(){ ended=true; listeners.forEach(f=>f()); };
}

/* ============================================================
   STAGE 6 — BONUS INTERLUDE: שיר הנקניק המבלבל (not for the exam)
   ============================================================ */
function runBonusInterlude(root, onDone){
  const pool = shuffle([
    ...shuffle(JOKE_ITEMS).map(x=>({label:x.label, icon:x.icon, real:false})),
    ...shuffle([...TPS_ITEMS, ...MIS_ITEMS, ...ESS_ITEMS]).slice(0,4).map(x=>({label:x.label, icon:x.icon, real:true})),
  ]);
  let idx=0, hits=0, ended=false; const listeners=[];
  const view = el('div','stage-view'); root.appendChild(view);
  view.innerHTML = `<div class="tag-not-exam">בונוס — לא לבחינה!</div>${mascotHTML('🎸')}
    <h3 class="stage-title">שיר הנקניק המבלבל</h3>
    <p class="stage-sub">״שלום שמי שניר, אני מוכרת שימורי דגים, אבל תכף אהיה אספית גרניט...״</p>
    <div id="bonus-body"></div>`;
  const body = view.querySelector('#bonus-body');
  let timer=null;

  function renderRound(){
    if(idx>=pool.length) return finish();
    const item = pool[idx];
    body.innerHTML = `
      <div class="panel" style="padding:14px 18px;font-size:1.5rem;">${item.icon} ${escapeHtml(item.label)}</div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn btn-good" id="b-real">מערכת אמיתית ✅</button>
        <button class="btn btn-danger" id="b-fake">בדיחה של המבולבלים 🌭</button>
      </div>`;
    function answer(said){
      clearTimeout(timer);
      const ok = said===item.real;
      if(ok){ hits++; hudAddScore(6); SFX.select(); }
      else { SFX.jingle(); mascotConfused(item.real? `זו כן דוגמה אמיתית מהקורס!` : `זו בדיחה של המבולבלים, לא מערכת מידע אמיתית!`); }
      if(!item.real){ showToast('🎵 שימורי דגים... אספית גרניט...', 'good'); }
      idx++; setTimeout(renderRound, 500);
    }
    const rb=body.querySelector('#b-real'), fb=body.querySelector('#b-fake');
    rb.addEventListener('click', ()=>answer(true));
    fb.addEventListener('click', ()=>answer(false));
    timer = setTimeout(()=>answer(null), 3200);
  }

  function finish(){
    if(ended) return; ended=true;
    body.innerHTML = `<div class="panel" style="padding:16px;">🎉 ${hits}/${pool.length} זיהוי נכון! חוזרים למפה...</div>`;
    setTimeout(()=>onDone({}), 1300);
  }
  renderRound();
  return function teardown(){ ended=true; clearTimeout(timer); };
}

/* ============================================================
   STAGE 5 — מסלול המיון המטורף (rapid-fire 4-bin sorting rush)
   ============================================================ */
function runSortRush(root, onDone, endless){
  const POOL = shuffle([
    ...TPS_ITEMS.map(x=>({label:x.label,icon:x.icon,kind:'TPS'})),
    ...MIS_ITEMS.map(x=>({label:x.label,icon:x.icon,kind:'MIS'})),
    ...ESS_ITEMS.map(x=>({label:x.label,icon:x.icon,kind:'ESS'})),
    ...JOKE_ITEMS.map(x=>({label:x.label,icon:x.icon,kind:'TRASH'})),
  ]);
  const TOTAL = endless ? Infinity : 24;
  let round=0, correct=0, wrong=0, ended=false;
  const listeners=[];

  const header = el('div','stage-view');
  header.style.pointerEvents='none'; header.style.justifyContent='flex-start'; header.style.paddingTop='46px';
  header.innerHTML = `<div class="panel" style="padding:6px 12px;font-size:.75rem;">⚡ מיינו הכול, מהר: TPS · MIS · ESS · או לפח האשפה 🗑️</div>`;
  root.appendChild(header);

  const bins = el('div','rush-bins');
  bins.innerHTML = `
    <button class="bin-btn bin-tps" data-k="TPS">🧾 TPS</button>
    <button class="bin-btn bin-mis" data-k="MIS">📊 MIS</button>
    <button class="bin-btn bin-ess" data-k="ESS">🔭 ESS</button>
    <button class="bin-btn bin-trash" data-k="TRASH">🗑️ פח</button>
  `;
  root.appendChild(bins);

  const canvas = $('#game-canvas'); canvas.style.display='block';
  const screenEl = $('#screen');
  function resize(){ canvas.width=screenEl.clientWidth; canvas.height=screenEl.clientHeight; }
  resize();
  const ctx = canvas.getContext('2d');

  let current=null, roundStart=0, timeLimit=3000, raf=null, locked=false;

  function nextRound(){
    round++;
    if(round>TOTAL){ return finish(); }
    current = pick(POOL);
    roundStart = performance.now();
    timeLimit = Math.max(endless?1000:1200, 3000 - round*75);
    locked=false;
  }

  function onBinClick(e){
    if(locked || !current) return;
    const k = e.currentTarget.dataset.k;
    locked=true;
    const ok = k===current.kind;
    if(ok){
      correct++; hudCorrect(8);
      if(current.kind==='TRASH'){ SFX.jingle(); showToast('🎵 שלום שמי שניר... אספית גרניט...', 'good'); }
      else SFX.select();
      burstConfetti(canvas.width/2, canvas.height*0.65, 14);
    } else {
      wrong++;
      const isEnd = hudWrong(true);
      mascotConfused(`״${current.label}״ שייך ל-${current.kind==='TRASH'?'פח (זו בדיחה!)':current.kind}, לא ל-${k}.`);
      if(isEnd){ finish(); return; }
    }
    setTimeout(nextRound, 260);
  }
  bins.querySelectorAll('.bin-btn').forEach(b=>b.addEventListener('click', onBinClick));
  listeners.push(()=>bins.querySelectorAll('.bin-btn').forEach(b=>b.removeEventListener('click', onBinClick)));

  function frame(now){
    if(ended) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(current && !locked){
      const t = (now-roundStart)/timeLimit;
      if(t>=1){
        locked=true; wrong++;
        const isEnd = hudWrong(true);
        mascotConfused(`הזמן נגמר על ״${current.label}״ (${current.kind==='TRASH'?'בדיחה — שייך לפח':current.kind}).`);
        if(isEnd){ finish(); return; }
        setTimeout(nextRound, 260);
      } else {
        const y = 60 + t*(canvas.height-190);
        const cx = canvas.width/2;
        ctx.save();
        ctx.beginPath(); ctx.arc(cx,y,36,0,Math.PI*2);
        ctx.fillStyle='rgba(255,255,255,.08)'; ctx.fill();
        ctx.lineWidth=3; ctx.strokeStyle = t>0.7?'#f87171':'#fff'; ctx.stroke();
        ctx.font='30px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle='#fff'; ctx.fillText(current.icon, cx, y-6);
        ctx.font='11px Arial'; ctx.fillStyle='#eef2ff';
        wrapLabelRush(ctx, current.label, cx, y+42, 150);
        // timer ring
        ctx.beginPath(); ctx.arc(cx,y,44,-Math.PI/2, -Math.PI/2+t*Math.PI*2);
        ctx.strokeStyle='#fbbf24'; ctx.lineWidth=3; ctx.stroke();
        ctx.restore();
      }
    }
    raf = requestAnimationFrame(frame);
  }
  function wrapLabelRush(ctx,text,cx,cy,maxWidth){
    const words=text.split(' '); let line=''; let lines=[];
    words.forEach(w=>{ const test=line?line+' '+w:w; if(ctx.measureText(test).width>maxWidth && line){lines.push(line); line=w;} else line=test; });
    if(line) lines.push(line);
    lines.slice(0,2).forEach((l,i)=>ctx.fillText(l,cx,cy+i*13));
  }

  function finish(){
    if(ended) return; ended=true;
    if(raf) cancelAnimationFrame(raf);
    const total = correct+wrong;
    const accuracy = total? correct/total : 1;
    const stars = accuracy>=.85?3:accuracy>=.65?2:total?1:0;
    onDone({accuracy, stars, scoreReached:HUD.score, tldr:'יא חופר? כשהראש שלכם קופץ מיד בין TPS/MIS/ESS/פח בלי לחשוב פעמיים — אתם מוכנים למבחן.'});
  }
  raf = requestAnimationFrame(frame);
  nextRound();
  return function teardown(){
    ended=true; if(raf) cancelAnimationFrame(raf);
    listeners.forEach(f=>f());
    canvas.style.display='none';
    bins.remove();
  };
}

/* ============================================================
   STAGE 7 — BOSS: קרב הבוס — המבחן האמריקאי
   ============================================================ */
const PHASE_META = [
  {key:'tps', label:'TPS', color:'var(--tps)', bossEmoji:'🧾👹'},
  {key:'mis', label:'MIS', color:'var(--mis)', bossEmoji:'📊👹'},
  {key:'ess', label:'ESS', color:'var(--ess-gold)', bossEmoji:'🔭👹'},
  {key:'claims', label:'טענות מעורבות', color:'var(--pink)', bossEmoji:'🕶️👹'},
  {key:'advanced', label:'מומחים', color:'var(--danger)', bossEmoji:'🧠👹'},
];
function shuffleQuestion(q){
  const idxs = shuffle(q.options.map((_,i)=>i));
  return {stem:q.stem, options:idxs.map(i=>q.options[i]), correct:idxs.indexOf(q.correct), explain:q.explain};
}
function runBoss(root, onDone){
  let phaseIdx=0, questions=[], qIdx=0, phaseLives=3, phaseCorrect=0;
  let totalCorrect=0, totalWrong=0, ended=false, qTimer=null, tStart=0;
  const TIME_LIMIT = 22000;
  const view = el('div','boss-wrap'); root.appendChild(view);
  hudReset(3);
  $('#lives-chip').style.visibility='hidden';

  function startPhase(){
    const meta = PHASE_META[phaseIdx];
    questions = shuffle(BOSS_BANK[meta.key]).map(shuffleQuestion);
    qIdx=0; phaseLives=3; phaseCorrect=0;
    startMusic(4 + phaseIdx);
    renderQuestion();
  }

  function renderQuestion(){
    if(ended) return;
    if(qIdx>=questions.length) return phaseCleared();
    const meta = PHASE_META[phaseIdx];
    const q = questions[qIdx];
    const hpFrac = Math.max(0, 1 - phaseCorrect/questions.length);
    view.innerHTML = `
      <div class="boss-top">
        <div class="boss-avatar">${meta.bossEmoji}</div>
        <div style="font-size:.75rem;color:${meta.color}">שלב בוס ${phaseIdx+1}/${PHASE_META.length} — ${meta.label}</div>
        <div class="hpbar"><i style="width:${Math.round(hpFrac*100)}%"></i></div>
        <div class="hud-chip" style="font-size:.7rem;">❤️×${Math.max(0,phaseLives)}</div>
      </div>
      <div class="timerbar"><i id="qtimer" style="width:100%"></i></div>
      <div class="q-panel">
        <div class="panel q-stem" style="padding:12px;">${nl2br(q.stem)}</div>
        <div id="q-opts" style="display:flex;flex-direction:column;gap:8px;">
          ${q.options.map((o,i)=>`<button class="q-opt" data-i="${i}">${escapeHtml(o)}</button>`).join('')}
        </div>
        <div id="explain-slot"></div>
      </div>`;
    tStart = performance.now();
    clearInterval(qTimer);
    qTimer = setInterval(()=>{
      const bar = $('#qtimer'); if(!bar) return;
      const frac = Math.max(0, 1-(performance.now()-tStart)/TIME_LIMIT);
      bar.style.width=(frac*100)+'%';
      if(frac<=0){ clearInterval(qTimer); answer(-1); }
    }, 100);
    view.querySelectorAll('.q-opt').forEach(b=>b.addEventListener('click', ()=>answer(+b.dataset.i)));
  }

  function answer(i){
    clearInterval(qTimer); ensureAudio();
    const q = questions[qIdx];
    view.querySelectorAll('.q-opt').forEach(b=>b.disabled=true);
    const ok = i===q.correct;
    view.querySelectorAll('.q-opt').forEach((b,bi)=>{
      if(bi===q.correct) b.classList.add('correct');
      else if(bi===i) b.classList.add('wrong');
    });
    if(ok){ phaseCorrect++; totalCorrect++; hudCorrect(18); SFX.correct(); }
    else { totalWrong++; noteConfusion(PHASE_META[phaseIdx].label); hudWrong(false); phaseLives--; SFX.wrong(); }
    $('#explain-slot').innerHTML = `<div class="explain-box">${ok?'✅ נכון! ':'❌ '}${nl2br(q.explain)}</div>
      <button class="btn btn-primary" id="q-continue" style="margin-top:10px;">המשך →</button>`;
    $('#q-continue').addEventListener('click', ()=>{
      if(phaseLives<=0){ mascotConfused('הבוס ניצח את הסבב הזה... בואו ננסה את השלב שוב!'); startPhase(); return; }
      qIdx++; renderQuestion();
    });
  }

  function phaseCleared(){
    SFX.boom();
    mascotHappy(`שלב ${PHASE_META[phaseIdx].label} של הבוס הובס!`);
    phaseIdx++;
    if(phaseIdx>=PHASE_META.length) return victory();
    setTimeout(startPhase, 900);
  }

  function victory(){
    view.innerHTML = `<div class="stage-view">
      <div style="font-size:3rem;">🕶️💥</div>
      <h2 class="stage-title">״רגע... הבוס הזה קצת מזכיר לי את האקסית שלי...״</h2>
      <p class="stage-sub">המבולבלים מזהה את הבוס. תעודת ״מוכנ/ה למבחן!״ שלכם מוכנה.</p>
      <button class="btn btn-good" id="victory-continue">קבלו את התעודה 🎓</button>
    </div>`;
    $('#victory-continue').addEventListener('click', ()=>finish(true));
  }

  function finish(won){
    if(ended) return; ended=true; clearInterval(qTimer);
    $('#lives-chip').style.visibility='';
    stopMusic();
    onDone({won, totalCorrect, totalWrong});
  }
  startPhase();
  return function teardown(){ ended=true; clearInterval(qTimer); $('#lives-chip').style.visibility=''; stopMusic(); };
}

function showBossResults(result){
  gotoScreen(root=>{
    const entries = Object.entries(SAVE.confusion).sort((a,b)=>b[1]-a[1]).slice(0,4);
    const confuseHtml = entries.length ? entries.map(([k,v])=>`<div class="confuse-row"><span>${escapeHtml(k)}</span><span>${v} טעויות</span></div>`).join('') : '<p class="stage-sub">כמעט בלי טעויות — כל הכבוד!</p>';
    root.appendChild(el('div','stage-view', `
      ${mascotHTML(result.won?'🎓':'🥲')}
      <h2 class="stage-title">${result.won ? 'ניצחתם את המבחן האמריקאי!' : 'הבוס ניצח הפעם...'}</h2>
      <p class="stage-sub">תשובות נכונות: ${result.totalCorrect} • שגויות: ${result.totalWrong}</p>
      <div class="panel" style="padding:12px 16px;width:min(90%,320px);">
        <b style="font-size:.8rem;">מדד הבלבול שלכם:</b>${confuseHtml}
      </div>
      ${result.won ? '<p class="stage-sub" style="color:var(--warn)">🔓 נפתח מצב חופשי!</p>' : ''}
      <div class="btn-row">
        <button class="btn btn-good" id="btn-retry-boss">קרב מחדש</button>
        <button class="btn btn-primary" id="btn-map">חזרה למפה</button>
      </div>
    `));
    $('#btn-retry-boss').addEventListener('click', ()=>startNode(nodeByKey('boss')));
    $('#btn-map').addEventListener('click', renderMap);
  });
}

/* ============================================================
   FREE PLAY (endless remix of the sorting rush)
   ============================================================ */
function startFreePlay(){
  hudReset(5);
  startMusic(8);
  gotoScreen(root => runSortRush(root, ()=>{
    stopMusic();
    gotoScreen(root2=>{
      root2.appendChild(el('div','stage-view', `
        ${mascotHTML('⚡')}
        <h2 class="stage-title">מצב חופשי הסתיים</h2>
        <p class="stage-sub">ניקוד: ${HUD.score}</p>
        <div class="btn-row">
          <button class="btn btn-good" id="fp-again">שוב!</button>
          <button class="btn btn-primary" id="fp-menu">לתפריט</button>
        </div>`));
      $('#fp-again').addEventListener('click', startFreePlay);
      $('#fp-menu').addEventListener('click', renderMenu);
    });
  }, true));
}

   BOOT
   ============================================================ */
renderMusicBtn();
$('#music-btn').addEventListener('click', ()=>{ ensureAudio(); toggleMusicMute(); });
$('#pause-btn').addEventListener('click', ()=>{
  ensureAudio();
  openModal(`<div class="panel" style="padding:20px;display:flex;flex-direction:column;gap:10px;width:min(80%,300px);text-align:center;">
    <h3>⏸ הפסקה</h3>
    <button class="btn btn-primary" id="pm-resume">המשך משחק</button>
    <button class="btn btn-ghost" id="pm-music">${MUSIC.enabled?'🔊 השתקת מוזיקה':'🔇 הפעלת מוזיקה'}</button>
    <button class="btn btn-ghost" id="pm-satchel">🎒 ילקוט הידע</button>
    <button class="btn btn-danger" id="pm-menu">יציאה לתפריט ראשי</button>
  </div>`);
  $('#pm-resume').addEventListener('click', closeModal);
  $('#pm-music').addEventListener('click', ()=>{ toggleMusicMute(); closeModal(); });
  $('#pm-satchel').addEventListener('click', ()=>showSatchel(null));
  $('#pm-menu').addEventListener('click', ()=>{ closeModal(); renderMap(); });
});

renderMenu();
